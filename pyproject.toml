[project]
name = "ledgermind"
version = "0.1.0"
description = "Hands-off crypto trading bot that follows on-chain wallet consensus and reports daily to Notion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "DTZ", # timezone-aware datetimes only
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
